services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: jeopardy
      POSTGRES_USER: jeopardy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeopardy-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jeopardy -d jeopardy']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin-local}
      # Desktop-Modus: lokal standardmäßig ohne pgAdmin-Anmeldung.
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE:-False}
      # Bereits angelegten lokalen Benutzer auch im Desktop-Modus verwenden.
      PGADMIN_CONFIG_DESKTOP_USER: "'${PGADMIN_EMAIL:-admin@example.com}'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/misc/ping']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: web-jeopardy-api:latest
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      DATABASE_URL: postgresql://jeopardy:${POSTGRES_PASSWORD:-jeopardy-local}@postgres:5432/jeopardy
      HOST: 0.0.0.0
      PORT: 3001
      CONTENT_DIR: /app/content/topics
      CONTENT_WRITE_TOKEN: ${CONTENT_WRITE_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./content/topics:/app/content/topics:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: web-jeopardy:latest
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Basisadresse ohne /api und ohne abschließenden Slash (nginx behält den Pfad).
      JEOPARDY_API_URL: ${JEOPARDY_API_URL:-http://api:3001}
      # Platzhalter für den späteren Online-Modus (Phase 2).
      JEOPARDY_WS_URL: ''
    restart: unless-stopped

volumes:
  postgres-data:
  pgadmin-data:
