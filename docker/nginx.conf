server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-Page-Anwendung: unbekannte Pfade beantwortet index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Artefakte ändern sich nie unter demselben Namen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dieselbe Origin für Oberfläche und Fragen-API, keine DB-Zugangsdaten im Browser.
    location /api/ {
        proxy_pass ${JEOPARDY_API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
