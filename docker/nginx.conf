server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-Page-Anwendung: unbekannte Pfade beantwortet index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Artefakte ändern sich nie unter demselben Namen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fragensets und Einstiegsseite dürfen nicht zwischengespeichert werden,
    # damit nachgereichte Fragensets sofort sichtbar sind.
    location /topics/ {
        add_header Cache-Control "no-cache";
        types { application/json json; }
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
