apiVersion: v1
kind: Pod
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: jeopardy_test
        - name: POSTGRES_USER
          value: jeopardy_test
        - name: POSTGRES_PASSWORD
          value: ci-only
      readinessProbe:
        exec:
          command: ['pg_isready', '-U', 'jeopardy_test', '-d', 'jeopardy_test']
        initialDelaySeconds: 2
        periodSeconds: 2
      volumeMounts:
        - name: postgres-test-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: postgres-test-data
      emptyDir: {}
